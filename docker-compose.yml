# docker-compose.yml
version: '3.8'

services:
  recommender-implicit:
    restart: always
    environment:
      - WORKERS=2              # Tăng workers nếu RAM đủ
      - AUTO_TRAIN=false       # Tắt auto-train, train thủ công lần đầu
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"