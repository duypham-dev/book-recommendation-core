version: '3.8'

services:
  # Hybrid Implicit ALS + SBERT Recommender Service
  recommender:
    build:
      context: .
      dockerfile: dockerfile
    container_name: book-recommender
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      # Override the port inside container if needed
      - PORT=8003
      - WORKERS=1
      # Set to true if you want the model to train automatically on startup
      - AUTO_TRAIN=false
    volumes:
      # Mount artifacts to persist trained models
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped

