version: '3.8'

services:
  # Implicit SBERT Recommender Service
  recommender-implicit:
    build:
      context: .
      dockerfile: dockerfile
    container_name: book-rec-implicit
    ports:
      - "8003:8003"
    environment:
      # Server config
      - APP_MODULE=server:app
      - HOST=0.0.0.0
      - PORT=8003
      - WORKERS=1
      
      # Auto-train on startup if models not found
      - AUTO_TRAIN=true
      
      # Database connection
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=book_recommendation_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=book_recommendation_system
      
      # Java backend callback
      - JAVA_BACKEND_URL=http://host.docker.internal:8080/api/v1
      - CALLBACK_ENABLED=true
    volumes:
      # Mount artifacts to persist trained models
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    networks:
      - book-rec-network
    depends_on:
      - postgres
    restart: unless-stopped

  # PostgreSQL Database (if not using external DB)
  postgres:
    image: postgres:15-alpine
    container_name: book-rec-postgres
    environment:
      - POSTGRES_DB=book_recommendation_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - book-rec-network
    restart: unless-stopped

networks:
  book-rec-network:
    driver: bridge

volumes:
  postgres-data:
